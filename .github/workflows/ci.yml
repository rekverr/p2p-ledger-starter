name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ledger-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: ledger_test
          POSTGRES_DB: ledger_concurrency_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_concurrency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/ledger-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ledger-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand --no-watchman
      - run: npm run test:integration:concurrency
      - run: npm run test:integration:event-store
      - run: npm run test:integration:migration

  payments-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments_test
          POSTGRES_PASSWORD: payments_test
          POSTGRES_DB: payments_persistence_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U payments_test -d payments_persistence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/payments-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/payments-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand --no-watchman
      - run: npm run test:integration:persistence
      - run: npm run test:integration:transfers
      - run: npm run test:integration:saga
      - run: npm run test:integration:split-bills

  notifications-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifications_test
          POSTGRES_PASSWORD: notifications_test
          POSTGRES_DB: notifications_persistence_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U notifications_test -d notifications_persistence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/notifications-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/notifications-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand --no-watchman
      - run: npm run test:integration:persistence

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  gateway-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/gateway-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand --no-watchman

  compose-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
