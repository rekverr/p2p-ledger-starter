services:
  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - '5433:5432'
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ledger-data

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - '5434:5432'
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payments-data

  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - '5435:5432'
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - notifications-data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: p2p
      RABBITMQ_DEFAULT_PASS: p2p
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'

  ledger-service:
    build: ./apps/ledger-service
    env_file: ./apps/ledger-service/.env.example
    environment:
      DATABASE_HOST: ledger-db
      OTEL_SERVICE_NAME: ledger-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      ledger-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '3001:3001'
    networks:
      - default
      - ledger-data

  payments-service:
    build: ./apps/payments-service
    env_file: ./apps/payments-service/.env.example
    environment:
      OTEL_SERVICE_NAME: payments-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '3002:3002'
    networks:
      - default
      - payments-data

  notifications-service:
    build: ./apps/notifications-service
    env_file: ./apps/notifications-service/.env.example
    environment:
      OTEL_SERVICE_NAME: notifications-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '3003:3003'
    networks:
      - default
      - notifications-data

  gateway-service:
    build: ./apps/gateway-service
    env_file: ./apps/gateway-service/.env.example
    environment:
      OTEL_SERVICE_NAME: gateway-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - ledger-service
      - payments-service
      - notifications-service
    ports:
      - '3004:3004'

  frontend:
    build: ./apps/frontend
    env_file: ./apps/frontend/.env.example
    environment:
      GATEWAY_SERVICE_URL: http://gateway-service:3004
      NEXT_PUBLIC_NOTIFICATIONS_WS_URL: http://localhost:3003
      NEXT_PUBLIC_JAEGER_URL: http://localhost:16686
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      - gateway-service
    ports:
      - '3000:3000'

volumes:
  ledger-db-data:
  payments-db-data:
  notifications-db-data:
  rabbitmq-data:

networks:
  ledger-data:
    internal: true
  payments-data:
    internal: true
  notifications-data:
    internal: true
